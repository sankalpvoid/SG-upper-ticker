<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SG Market Ticker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@500;600;700;800&display=swap');
  :root{--bg:#11141b;--gold:#c5a866;--green:#10b981;--red:#ef4444;--text:#e9e9e7;--muted:#9297a2;--line:rgba(197,168,102,.42)}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
  body{font-family:Inter,system-ui,sans-serif;color:var(--text)}
  .ticker{position:relative;width:100%;height:60px;display:flex;align-items:center;overflow:hidden;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid rgba(197,168,102,.2);box-shadow:0 5px 18px rgba(0,0,0,.16)}
  .ticker:before,.ticker:after{content:"";position:absolute;z-index:2;top:0;bottom:0;width:26px;pointer-events:none}
  .ticker:before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
  .ticker:after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
  .viewport{width:100%;overflow:hidden;white-space:nowrap}
  .track{display:flex;width:max-content;align-items:center;will-change:transform;animation:scroll 56.67s linear infinite}
  .ticker:hover .track{animation-play-state:paused}
  .group{display:flex;align-items:center;flex-shrink:0}
  .item{height:60px;display:inline-flex;align-items:center;gap:9px;padding:0 18px;flex-shrink:0;white-space:nowrap;font-size:14px;letter-spacing:.01em}
  .section-label{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--gold);padding:0 16px;flex-shrink:0}
  .news-unavailable{font:700 13px/1 Inter,sans-serif;color:var(--muted)}
  .pair{font-weight:750;letter-spacing:.055em;color:#f2f0e9;font-size:12px}
  .price{font:700 18px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;color:#e4e6e8}
  .change{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
  .up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}
  .separator{height:24px;width:1px;margin:0 20px;background:var(--line);flex-shrink:0}
  .impact{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
  .high{background:#ef4444;box-shadow:0 0 7px rgba(239,68,68,.3)}
  .medium{background:#f97316}.low{background:#facc15;box-shadow:0 0 6px rgba(250,204,21,.22)}
  .news-time{font-size:10px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
  .news-title{font:700 17px/1 "Barlow Condensed",sans-serif;letter-spacing:.2px;color:#e7e8eb}
  .news-meta{font-size:10px;color:var(--muted)}
  .empty{padding:0 22px;color:var(--muted);font-size:12px}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.track{animation-duration:120s}}
</style>
</head>
<body>
<div class="ticker" role="marquee" aria-label="Market prices and economic news">
  <div class="viewport"><div class="track" id="track">
    <div class="group" id="group-a"><span class="empty">Connecting to market data…</span></div>
    <div class="group" id="group-b" aria-hidden="true"></div>
  </div></div>
</div>
<script>
(() => {
  const track = document.getElementById('track');
  const groupA = document.getElementById('group-a');
  const groupB = document.getElementById('group-b');
  const money = (v, pair) => {
    if (typeof v !== 'number' || !Number.isFinite(v)) return '—';
    const digits = (pair === 'GBP/USD' || pair === 'EUR/USD') ? 5 : 2;
    return v.toLocaleString('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits});
  };
  const safe = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function priceItem(q) {
    const change = Number(q.changePct);
    const cls = !Number.isFinite(change) || Math.abs(change) < .0005 ? 'flat' : change > 0 ? 'up' : 'down';
    const sign = Number.isFinite(change) && change > 0 ? '+' : '';
    return '<span class="item"><span class="pair">'+safe(q.pair)+'</span><span class="price">'+money(Number(q.price),q.pair)+'</span><span class="change '+cls+'">'+(Number.isFinite(change) ? sign+change.toFixed(2)+'%' : '')+'</span></span><span class="separator"></span>';
  }
  function newsItem(n) {
    const impact = String(n.impact || 'Low').toLowerCase();
    const time = n.time ? new Date(n.time) : null;
    const timeLabel = time && !Number.isNaN(time.getTime()) ? time.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Kolkata'})+' IST' : '';
    const eventDay = time && !Number.isNaN(time.getTime()) ? time.toLocaleDateString('en-US',{weekday:'short',timeZone:'Asia/Kolkata'}).toUpperCase() : '';
    const today = new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
    const eventDate = time && !Number.isNaN(time.getTime()) ? new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(time) : '';
    const dateLabel = eventDate && eventDate < today ? eventDay+' · ' : '';
    return '<span class="item"><span class="impact '+(impact==='high'?'high':impact==='medium'?'medium':'low')+'"></span><span class="news-time">'+safe(dateLabel+timeLabel)+'</span><span class="news-title">'+safe(n.title)+'</span>'+(n.actual ? '<span class="news-meta">ACT '+safe(n.actual)+'</span>' : '')+(n.forecast ? '<span class="news-meta">FC '+safe(n.forecast)+'</span>' : '')+'</span><span class="separator"></span>';
  }
  function render(data) {
    const parts = [];
    // Explicit news segment first, then the five requested market instruments.
    parts.push('<span class="section-label">USD NEWS</span><span class="separator"></span>');
    const news = Array.isArray(data.news) ? data.news : [];
    if (news.length) news.forEach(n => parts.push(newsItem(n)));
    else parts.push('<span class="item news-unavailable">USD calendar temporarily unavailable</span><span class="separator"></span>');
    parts.push('<span class="section-label">MARKETS</span><span class="separator"></span>');
    (data.prices || []).slice(0, 5).forEach(q => { if (Number.isFinite(Number(q.price))) parts.push(priceItem(q)); });
    if (!parts.length) {
      groupA.innerHTML = '<span class="empty">Market feed temporarily unavailable</span>';
      groupB.innerHTML = groupA.innerHTML;
    } else {
      const markup = parts.join('');
      groupA.innerHTML = markup;
      groupB.innerHTML = markup;
    }
    // Keep the second copy exactly half a track away for a seamless loop.
    requestAnimationFrame(() => {
      const width = groupA.getBoundingClientRect().width;
      const seconds = Math.max(38, Math.min(100, width / 25));
      track.style.animationDuration = seconds + 's';
    });
  }
  async function refresh() {
    try {
      const res = await fetch('/api/market', {cache:'no-store'});
      if (!res.ok) throw new Error('Feed response '+res.status);
      const data = await res.json();
      render(data);
    } catch (err) {
      // No fabricated quotes or headlines: retain the previous feed if available.
      if (!groupA.dataset.loaded) groupA.innerHTML = '<span class="empty">Market feed temporarily unavailable</span>';
    }
  }
  const originalRender = render;
  render = function(data) { originalRender(data); groupA.dataset.loaded = '1'; };
  refresh();
  setInterval(refresh, 60000);
})();
</script>
</body>
</html>
